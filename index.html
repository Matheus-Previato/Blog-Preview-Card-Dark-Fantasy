<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Vampire Knight | Blog Preview Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="ash-canvas"></canvas>

  <main class="blog-card">
    <div class="thumbnail-wrapper">
      <img src="./assets/images/illustration-article.svg" alt="Selo de Invocação" class="thumbnail-image">
      <div class="thumbnail-overlay"></div>
    </div>

    <div class="card-content">
      <span class="category-badge">Learning</span>

      <span class="publish-date">Published 21 Dec 2023</span>

      <h1 class="post-title"><a href="#">HTML & CSS foundations</a></h1>

      <p class="post-description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>

    <div class="author-block">
      <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="author-avatar">
      <span class="author-name">Greg Hooper</span>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Matheus</a>.
  </footer>

  <script src="./js/script.js"></script>
</body>
</html>
